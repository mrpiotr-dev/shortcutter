name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case or problem, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: An API sketch, an example from another library, or a description.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you have tried
