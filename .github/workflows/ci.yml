name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: true

      # Build first: the apps type-check against the built packages, and the docs build generates
      # Astro's content types. vp builds workspace packages in dependency order.
      - name: Build (incl. publint + attw)
        run: vp run -r build

      - name: Format, lint & type-check
        run: vp check

      - name: Test
        run: vp run -r test:coverage
