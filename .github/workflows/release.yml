name: Release

# Runs when a release/* (or hotfix/*) branch is merged into main. The version bump and changelog
# were made on that branch with `pnpm run version-packages`, so here Changesets only publishes the
# versions that are not on npm yet, pushes their git tags and creates a GitHub release for each.

on:
  push:
    branches: [main]

permissions:
  contents: write # git tags and GitHub releases
  id-token: write # npm Trusted Publishing (OIDC) and provenance, no npm token stored

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: true

      # pnpm (pinned in package.json) publishes itself: it exchanges the GitHub OIDC token for npm
      # Trusted Publishing and adds provenance, so no npm token and no npm upgrade are needed.
      - name: Publish
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm run release
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
