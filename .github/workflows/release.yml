name: Release

# Staged releases: CI can upload a release to npm but never make it public on its own.
#
# 1. Merging develop (or a hotfix/* branch) into main stages every package version that is not on
#    npm yet, through npm Trusted Publishing (OIDC, "stage publish" permission) with provenance.
#    The versions and changelogs were made earlier with `pnpm run version-packages`.
# 2. A maintainer makes them public with `pnpm stage approve`, confirmed with 2FA.
# 3. Running this workflow by hand (`gh workflow run release.yml`) then pushes a git tag for every
#    published version that has none and creates the GitHub release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # git tags and GitHub releases
  id-token: write # npm Trusted Publishing (OIDC) and provenance, no npm token stored

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: true

      # Versions already on npm are skipped, and private packages (docs, playground) are never sent.
      - name: Stage new versions on npm
        run: pnpm run release

      - name: Summary
        run: node scripts/release.mjs summary >> "$GITHUB_STEP_SUMMARY"

  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag published versions and create the GitHub release
        run: node scripts/release.mjs tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
